name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web-frontend/**"
      - ".github/workflows/publish.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      # 最小权限原则：只授予必要的权限
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up CI environment
        run: |
          echo "🔹 是否为 CI 环境: $CI"

      - name: Install pnpm
        # pnpm 版本由 package.json 的 packageManager 字段统一指定（当前 pnpm@12.3.4），
        # action-setup@v4 会自动读取该字段，此处不再显式设置 version，避免冲突
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 指定 node 版本缓存，避免重复下载
          cache: "pnpm"
          # 明确指定缓存路径，提升缓存命中率
          cache-dependency-path: |
            **/pnpm-lock.yaml
            package.json

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build:frontend

      # Run a build step here if your project requires
      - name: Cloudflare Pages GitHub Action
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./apps/web-frontend/dist --project-name=gameevent-frontend
